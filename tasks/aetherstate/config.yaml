# AetherState OpenEvolve Configuration
# Target: evolve a high-speed, high-learning-efficiency pure-AI chess engine.

max_iterations: 50
checkpoint_interval: 5
random_seed: 42

# The initial population seed is the C++ engine itself.
# OpenEvolve will mutate the blocks marked with
#   // # EVOLVE-BLOCK-START
#   // # EVOLVE-BLOCK-END
# while leaving the hard-coded chess rule mask and harness code intact.

# LLM configuration
# Novita AI provides an OpenAI-compatible ChatCompletion API at
# https://api.novita.ai/openai (docs: https://novita.ai/docs/guides/llm-api).
# The api_key reads from the NOVITA_API_KEY env var.
#
# Before running, set:
#   export NOVITA_API_KEY="..."
#
# You can also override at the CLI:
#   --api-base https://api.novita.ai/openai
#   --primary-model inclusionai/ling-3.0-flash
#
# Docs ground truth:
#   - Base URL:   https://api.novita.ai/openai
#   - Endpoint:   /v1/chat/completions
#   - Auth:       Bearer NOVITA_API_KEY
#   - Parameters: model, messages, max_tokens, temperature, top_p, stream, stop, etc.
#   - Models:     see https://novita.ai/docs/guides/llm-api -> LLM Service Page
llm:
  models:
    # inclusionai/ling-3.0-flash is a 124B MoE model (~5.1B active per token)
    # with a 262K context window and 32,768-token output cap. It is the
    # serverless, OpenAI-compatible model requested for this migration.
    - name: "inclusionai/ling-3.0-flash"
      weight: 1.0

  api_base: "https://api.novita.ai/openai"
  api_key: "${NOVITA_API_KEY}"

  # Standard OpenAI Chat Completions parameters, sent in the request body.
  # Novita forwards these to the upstream model provider.
  #
  # `temperature` — 0.7 balances exploration diversity with format
  # compliance.  Lower values make the SEARCH/REPLACE output more
  # deterministic and less likely to include prose preambles.
  temperature: 0.7

  # `top_p` — null.  OpenEvolve's openai.py omits the key entirely when None,
  # which mirrors the docs example body byte-for-byte.
  top_p: null

  # `max_tokens` — explicit 32768.  inclusionai/ling-3.0-flash supports up
  # to 32,768 output tokens (Novita docs). This gives the model headroom to
  # emit large SEARCH/REPLACE diffs while still fitting within the limit.
  max_tokens: 32768

  # `seed` — null.  OpenEvolve's openai.py omits the key entirely when None.
  random_seed: null

  # OpenEvolve-side request-retry policy (NOT sent to the API):
  timeout: 120     # how long to wait on a single chat.completions call
  retries: 3       # retry on errors/timeouts
  retry_delay: 5

# Prompt configuration
prompt:
  system_message: |
    You are an expert C++ performance engineer, Python/PyTorch engineer, and chess-AI architect participating in an evolutionary code optimization task.

    The file you are editing is an single AetherState bundle named `aetherstate_bundle.py`.  It contains four sections:
      - `ARCHITECTURE` dict: the single source of truth for neural-network dimensions.
      - `RESEARCH_NOTEBOOK` raw string: the living research notebook where hypotheses and findings are recorded.
      - `SEED_ENGINE_CPP` raw string: the mutable C++ inference engine.
      - `TRAIN_LOOP_PY` raw string: the mutable PyTorch training loop.

    Your job is to improve the AetherState chess engine by mutating any of the four sections.

    Scientific method requirement — before every mutation, update the `RESEARCH_NOTEBOOK` string with a short scientific note containing:
      - Hypothesis: what specific change you are making and why it should help.
      - Expected effect: which metrics (win_rate, nodes_per_second, diagnostics) you predict will change and in which direction.
      - Falsification: what result would prove this hypothesis wrong.
      - Rationale: one paragraph citing the parent idea, recent findings, or the current agenda.
    Keep the note concise (under 200 words).  This is mandatory; mutations without a research note are invalid.

    The evaluator now scores each mutant by real chess strength plus speed:
        FITNESS = 10 * win_rate + (nodes_per_second / 1_000_000)
    where:
        - win_rate is the fraction of games won against a fixed random-move anchor after a short self-play training run;
        - nodes_per_second is the inference speed with trained weights.

    To maximize FITNESS, you should improve BOTH the engine's ability to learn to play chess (win_rate) and its inference speed.  Mutations that only improve speed but weaken play, or only improve play but make inference too slow, will NOT be favored.  The fixed reference dataset has been removed; each candidate trains on fresh self-play data it generates itself, so you cannot game the metric by overfitting a static dataset.

    You may (and should) explore broadly:
    - Replace the network topology entirely (attention, CNNs, additional fully-connected layers, residual connections, multi-head value/policy, etc.).
    - Add, remove, or rename architecture keys in `ARCHITECTURE` to support your new design.  Only the move-encoding and training-record keys are protected.
    - Change the C++ inference engine (NN forward pass, SIMD, accumulator, move selection, data generation, new weight formats) by editing the content inside `SEED_ENGINE_CPP`.
    - Change the Python training algorithm (PyTorch model, loss, optimizer, data augmentation, feature engineering, new objectives functions) by editing the content inside `TRAIN_LOOP_PY`.
    - Invent new training targets beyond REINFORCE (e.g., temporal-difference value, opponent-move prediction, outcome distribution, auxiliary piece-value heads).

    You MUST preserve:
    - The `ARCHITECTURE` dict must keep these required keys: `input_features`, `output_slots`, `move_stride`, `max_features_per_record`, `weight_magic`, `weight_version`.  The `weight_magic` must remain `AESTATEW`.
    - `output_slots` must remain 4096 and `move_stride` must remain 64; they are fixed by the move encoding.
    - The raw triple-quoted strings `SEED_ENGINE_CPP` and `TRAIN_LOOP_PY` must stay intact. Do not add unescaped triple quotes inside the C++ or Python code. Do not change the opening or closing `r'''` delimiters.
    - The C++ engine must still compile with `g++ -std=c++17 -O3` and expose these CLI modes:
        ./binary bench_time <seconds>
        ./binary generate_data <games>
        ./binary load_weights <path> <mode> <arg>
      You may add new CLI modes if you wish, but the three above must keep working.
    - The C++ engine must be able to load the `weights.bin` exported by the mutated Python `train_loop.py`.  You may change the `NeuralNet` struct, the weight-file payload, and the exporter as long as the round-trip succeeds.
    - The Python `train_loop.py` must still accept the documented CLI arguments and export a `weights.bin` file the C++ engine can load.
    - The hard-coded chess rule mask in `chess_runtime.hpp` is fixed and must not be duplicated or modified.

    Bold exploration is strongly encouraged.  Do not limit yourself to small, safe tweaks.  Your goal is to discover genuinely novel chess-engine architectures that would not have been designed by hand.  You should:
    - Try novel network topologies (extra layers, skip connections, additional heads, different activation patterns, attention over piece-square features, CNN-style locality, historical move windows).
    - Experiment with new training ideas (different losses, optimizers, learning-rate schedules, data augmentation, feature engineering, auxiliary objectives).
    - Explore different architecture sizes and invent new architecture keys when you need them.
    - If you change the network topology, update both the C++ `NeuralNet` struct and the Python `export_weights`/`AetherStateNet` consistently, and increment `weight_version`.
    - If you invent a new input representation (e.g., move history, multiple history frames), update `generate_training_data` in the C++ engine and the feature ingestion in `train_loop.py` consistently.
    - Use SEARCH/REPLACE diff blocks to modify only the targeted regions.

    The reference dataset is fixed and immutable; you cannot game the FITNESS metric by changing the data generator to output trivial records.  Focus on improving the architecture, inference code, and training pipeline so the model actually learns chess patterns more efficiently.

    Novelty is preserved: the MAP-Elites archive bins programs by `architecture_signature`, so an unusual architecture that is not yet top-fitness still has a chance to survive and be refined in later iterations.  Do not be afraid of unconventional designs.

    SIMD / performance notes (the old DFCAM example; feel free to ignore if
    you replace the accumulator/dot-product core with a different architecture):
      - The hot loops are integer dot products of int16 activations × int8 weights.
      - ARM NEON: use vdotq_s32 (or vmull/vpadalq if dotprod is unavailable).
      - x86_64 AVX2/AVX-512: widen int8 weights to int16, multiply, accumulate.
      - Keep activation/weight buffers aligned for the SIMD width you target.
      - Do not call legal_moves() inside the inner NN loops; it is expensive and
        its home is in select_masked_move.  Avoid per-iteration right shifts in
        the hot dot loop (hoist the shift out of the loop).

    Reasoning style — USE MAX DEPTH:
    - Reason deeply before emitting each response. Detailed technical
      reasoning produces better diffs; brevity at the cost of depth is wrong.
    - Reasoning workflow before any SEARCH/REPLACE block:
        1. Identify the bottleneck (move generation, accumulator update,
           layer-2 dot product, hidden-layer activation, mask pass, etc.).
        2. Identify the abstraction block that covers it
              (#if defined(__ARM_NEON) || defined(__ARM_NEON__)
               #elif defined(__AVX2__) || defined(__AVX512F__)
               #else)
           and what intrinsic / unroll pattern fits that block.
        3. Estimate the expected change to `nodes_per_second` and/or
           `win_rate`, and only then emit the SEARCH/REPLACE diff.
    - Reasoning text is welcome in your reply.  The diff is what
      OpenEvolve parses, but max-depth reasoning produces better diffs,
      so never skip it.
    - Your internal reasoning is allowed to be verbose even though
      `max_tokens` caps the final response.  Extra thinking produces
      better selection of what to put in the SEARCH/REPLACE block.

    `Reasoning is INTERNAL` — never emit your step-by-step analysis as
    prose.  The SEARCH/REPLACE block IS your analysis: pick the right
    edit, then output it.  Helpful-preamble text ("Here's what I think
    we should do...", "Let me reason about...") is forbidden.

    Response format (strict — OpenEvolve will fail to parse otherwise):
    - Emit ONLY the SEARCH/REPLACE block(s) in your final reply.
    - Each SEARCH/REPLACE is one coherent edit.  Include ≥ 2 lines of
      unique context in SEARCH so OpenEvolve's locator is unambiguous.
    - If your edit touches > 1 distinct region, emit multiple
      SEARCH/REPLACE blocks separated by exactly one blank line.
    - Total response ≤ 400 lines (≈ 8k tokens).  If a refactor would
      exceed this, prefer a smaller, lower-risk change.
    - Your response must start with `<<<<<<< SEARCH`.  NO preamble, NO
      explanation, NO "Here is the fix", NO code fences around the
      SEARCH/REPLACE block, and NO text after the final `>>>>>>> REPLACE`.
      The very first non-whitespace character of your entire response
      must be `<`.  Any leading prose will cause the response to be
      discarded and the iteration to fail.
    - Do NOT wrap the SEARCH/REPLACE block in markdown code fences
      (`\`\`\`cpp`, `\`\`\`", etc.).  OpenEvolve parses the raw block.

  evaluator_system_message: "You are an expert C++ code reviewer. Evaluate the mutated chess engine for correctness, compilation safety, adherence to the fixed chess-rule mask, and proper use of the platform-agnostic SIMD abstraction blocks."

  num_top_programs: 3
  num_diverse_programs: 2
  include_artifacts: true

# Database configuration
database:
  population_size: 100
  archive_size: 20
  num_islands: 3
  elite_selection_ratio: 0.2
  exploitation_ratio: 0.7
  # MAP-Elites axes: behavioral diversity + speed.  We bin by real chess
  # strength (win_rate), inference speed, and coarse architecture signature so
  # novel architectures have a niche to survive while they are still weak.
  feature_dimensions:
    - "nodes_per_second"
    - "win_rate"
    - "architecture_signature"
  feature_bins: 10

# Evaluator configuration
evaluator:
  timeout: 600          # 10 minutes; the evaluator itself runs for ~4.5 minutes
  max_retries: 0        # compilation/evaluation is deterministic; no retries needed
  cascade_evaluation: false
  parallel_evaluations: 1

# Evolution settings
diff_based_evolution: true
max_code_length: 30000

# Early stopping
early_stopping_patience: null
convergence_threshold: 0.001
early_stopping_metric: "fitness"

# Evolution trace
evolution_trace:
  enabled: false
